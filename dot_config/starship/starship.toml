# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$custom\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$gleam\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$nats\
$direnv\
$env_var\
$crystal\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$os\
$container\
$shell\
${custom.sync_ok}\
${custom.sync_stale}\
$character"""

[custom.git_name]
when = "git rev-parse --is-inside-work-tree > /dev/null 2>&1"
command = 'echo "$(git config user.name) [$(git config user.email)]"'
format = "as [$output]($style) "
style = "bright-red bold"

# Freshness of the synced setups (chezmoi + ai-cli-configs). Both modules only
# read the cache file that ~/.local/bin/sync-status-refresh writes in the
# background — no git, no chezmoi, no stow on the prompt path. Two modules
# rather than one because a custom module cannot pick its style per state.
# They are named explicitly in `format`, so `$custom` above skips them.

[custom.sync_ok]
when = 'test "$(cat "$HOME/.cache/sync-status" 2>/dev/null)" = "✓"'
command = "echo ✓"
format = "[$output]($style) "
style = "green bold"
shell = ["sh"]

[custom.sync_stale]
when = 'test -s "$HOME/.cache/sync-status" && test "$(cat "$HOME/.cache/sync-status")" != "✓"'
command = 'cat "$HOME/.cache/sync-status"'
format = "[$output]($style) "
style = "red bold"
shell = ["sh"]
