[fleet.install]
ref = "91e0bf7e2d8980253ed6a3689b2b427fbe227638"

[fleet.roles]
roz-laptop = ["mac"]
roz-mini-laptop = ["mac"]
dev-station = ["homelab"]
docker-host = ["homelab"]
media-host = ["homelab"]
proxmox = ["infra"]
raspbox1 = ["pi"]
raspbox2 = ["pi"]

[fleet.transport]
raspbox1 = "rex"
raspbox2 = "rex"

[fleet.channels]
"/.local/nvim/stable/" = "nvim-stable"
"/.local/nvim/nightly/" = "nvim-nightly"

[fleet.repos.chezmoi]
path = ".local/share/chezmoi"
roles = ["mac", "homelab"]

[fleet.repos.ai-cli-configs]
path = "Dev/ai-cli-configs"
roles = ["mac", "homelab"]
stow = ["common/.agents", "claude/.claude", "pi/.pi"]

[fleet.items]
claude = { roles = ["mac", "homelab"], upgrade = { brew-cask = "brew upgrade --cask claude-code" } }
pi = { roles = ["mac", "homelab"] }
nvim = { roles = ["mac", "homelab"], channel = "nvim-stable", install = "update-nvim stable", upgrade = { nvim-stable = "update-nvim stable", nvim-nightly = "update-nvim nightly" } }
rg = { roles = ["mac", "homelab"], upgrade = { os-package = "sudo apt-get update && sudo apt-get install --only-upgrade ripgrep" } }
fd = { roles = ["mac", "homelab"] }
chezmoi = { roles = ["mac", "homelab", "infra", "pi"] }
mise = { roles = ["mac", "homelab"] }
docker = { roles = ["mac", "homelab"], upgrade = { os-package = "sudo apt-get update && sudo apt-get install --only-upgrade docker-ce docker-ce-cli" } }
git = { roles = ["mac", "homelab"] }
stow = { roles = ["mac"] }
starship = { roles = ["mac", "homelab"] }
lazydocker = { roles = ["mac", "homelab"] }
fzf = { roles = ["mac", "homelab"] }
bat = { roles = ["mac", "homelab"] }
eza = { cmd = "eza --version | sed -n 2p", roles = ["mac", "homelab"] }
gh = { roles = ["mac", "homelab"] }
tmux = { cmd = "tmux -V", roles = ["mac", "homelab"] }
zoxide = { roles = ["mac", "homelab"] }
jq = { roles = ["mac", "homelab"] }
